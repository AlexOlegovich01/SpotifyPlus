<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="SpotifyPlus logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2a24"/>
      <stop offset="1" stop-color="#0b0f0d"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3ee27a"/>
      <stop offset="1" stop-color="#14b24f"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Equalizer bars -->
  <g fill="url(#green)">
    <rect x="96"  y="236" width="56" height="150" rx="28"/>
    <rect x="176" y="168" width="56" height="218" rx="28"/>
    <rect x="256" y="204" width="56" height="182" rx="28"/>
  </g>

  <!-- Plus -->
  <g fill="none" stroke="#ffffff" stroke-width="40" stroke-linecap="round">
    <path d="M388 114v112"/>
    <path d="M332 170h112"/>
  </g>
</svg>
